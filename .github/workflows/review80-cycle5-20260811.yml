name: File 05 Fifth Independent Review-80 Corrective Runner

on:
  push:
    branches: [ codex/file-05-complete-v3.0.0 ]

permissions:
  contents: write

concurrency:
  group: file05-review80-cycle5
  cancel-in-progress: false

jobs:
  review80-cycle5:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact candidate branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: codex/file-05-complete-v3.0.0
          fetch-depth: 0

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc
        with:
          php-version: '8.3'
          coverage: none

      - name: Repair cycle5 review transport
        run: python3 scripts/review80-cycle5-hotfix.py

      - name: Execute 80 sequential review-fix rounds
        id: review80
        shell: bash
        run: |
          set -o pipefail
          python3 scripts/review80-cycle5-20260811.py 2>&1 | tee /tmp/review80-cycle5.txt

      - name: Persist runner diagnostic on failure
        if: failure() && steps.review80.outcome == 'failure'
        shell: bash
        run: |
          cp /tmp/review80-cycle5.txt /tmp/review80-cycle5-preserved.txt 2>/dev/null || true
          git config user.name 'majidhussainqadri1-dot'
          git config user.email 'majidhussainqadri1@gmail.com'
          git reset --hard HEAD
          git clean -fd
          printf '%s\n' 'Fifth Review-80 runner failed before corrected-source commit. Diagnostic only; not product completion evidence.' > REVIEW80-CYCLE5-FAILURE-DIAGNOSTIC.txt
          cat /tmp/review80-cycle5-preserved.txt >> REVIEW80-CYCLE5-FAILURE-DIAGNOSTIC.txt 2>/dev/null || true
          git add REVIEW80-CYCLE5-FAILURE-DIAGNOSTIC.txt
          git commit -m 'Record fifth Review-80 runner diagnostic' || true
          git push origin HEAD:codex/file-05-complete-v3.0.0 || true
          exit 1

      - name: Remove temporary review transport
        if: steps.review80.outcome == 'success'
        run: |
          rm -f scripts/review80-cycle5-hotfix.py
          rm -f scripts/review80-cycle5-20260811.py
          rm -f .github/workflows/review80-cycle5-20260811.yml
          rm -f REVIEW80-CYCLE5-FAILURE-DIAGNOSTIC.txt

      - name: Full source security policy Future18 regression gate
        if: steps.review80.outcome == 'success'
        run: bash tests/source-invariants.sh

      - name: PHP 8.3 full syntax gate
        if: steps.review80.outcome == 'success'
        run: find 05-learn-sabri-classical-homeopathy tests -type f -name '*.php' -print0 | sort -z | xargs -0 -n1 php -l

      - name: Set up PHP 7.4
        if: steps.review80.outcome == 'success'
        uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc
        with:
          php-version: '7.4'
          coverage: none

      - name: PHP 7.4 full syntax gate
        if: steps.review80.outcome == 'success'
        run: find 05-learn-sabri-classical-homeopathy tests -type f -name '*.php' -print0 | sort -z | xargs -0 -n1 php -l

      - name: Deterministic package A B closure
        if: steps.review80.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/file05-c5-a /tmp/file05-c5-b /tmp/file05-c5-extract
          mkdir -p /tmp/file05-c5-a /tmp/file05-c5-b /tmp/file05-c5-extract
          python3 scripts/build-release.py --root . --output /tmp/file05-c5-a/05-learn-sabri-classical-homeopathy-4.0.0.zip
          python3 scripts/build-release.py --root . --output /tmp/file05-c5-b/05-learn-sabri-classical-homeopathy-4.0.0.zip
          cmp /tmp/file05-c5-a/05-learn-sabri-classical-homeopathy-4.0.0.zip /tmp/file05-c5-b/05-learn-sabri-classical-homeopathy-4.0.0.zip
          unzip -t /tmp/file05-c5-a/05-learn-sabri-classical-homeopathy-4.0.0.zip
          unzip -q /tmp/file05-c5-a/05-learn-sabri-classical-homeopathy-4.0.0.zip -d /tmp/file05-c5-extract
          (cd /tmp/file05-c5-extract/05-learn-sabri-classical-homeopathy && sha256sum -c MANIFEST.sha256)

      - name: Commit corrected exact working tree
        if: steps.review80.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'majidhussainqadri1-dot'
          git config user.email 'majidhussainqadri1@gmail.com'
          git status --short
          git add -A
          if git diff --cached --quiet; then
            echo 'No corrective changes to commit.'
            exit 0
          fi
          git commit -m 'Complete fifth independent File 05 Review-80 corrective closure'
          git push origin HEAD:codex/file-05-complete-v3.0.0
