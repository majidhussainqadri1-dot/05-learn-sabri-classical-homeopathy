name: File 05 Current Plans Integrity

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: file05-current-plans-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc # 2.37.1
        with:
          php-version: '8.3'
          coverage: none
      - name: Current-plan architecture, security, Future-18 policy and JavaScript checks
        run: bash tests/source-invariants.sh

  php-syntax:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.3']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc # 2.37.1
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Lint canonical PHP source and tests
        shell: bash
        run: |
          set -euo pipefail
          find 05-learn-sabri-classical-homeopathy tests -type f -name '*.php' -print0 \
            | sort -z | xargs -0 -n1 php -l

  reproducible-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build twice and compare exact bytes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-a build-b
          python3 scripts/build-release.py --root . --output build-a/05-learn-sabri-classical-homeopathy-4.0.0.zip
          python3 scripts/build-release.py --root . --output build-b/05-learn-sabri-classical-homeopathy-4.0.0.zip
          cmp build-a/05-learn-sabri-classical-homeopathy-4.0.0.zip build-b/05-learn-sabri-classical-homeopathy-4.0.0.zip
          unzip -t build-a/05-learn-sabri-classical-homeopathy-4.0.0.zip
          rm -rf build-a/extracted
          mkdir -p build-a/extracted
          unzip -q build-a/05-learn-sabri-classical-homeopathy-4.0.0.zip -d build-a/extracted
          test -s build-a/extracted/05-learn-sabri-classical-homeopathy/MANIFEST.sha256
          test -s build-a/extracted/05-learn-sabri-classical-homeopathy/SBOM.spdx.json
          (cd build-a/extracted/05-learn-sabri-classical-homeopathy && sha256sum -c MANIFEST.sha256)
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('build-a/extracted/05-learn-sabri-classical-homeopathy/SBOM.spdx.json')
          data=json.loads(p.read_text(encoding='utf-8'))
          assert data['spdxVersion']=='SPDX-2.3'
          assert data['packages'][0]['versionInfo']=='4.0.0'
          PY
          diff -u \
            <(cd 05-learn-sabri-classical-homeopathy && find . -type f -print | sort) \
            <(cd build-a/extracted/05-learn-sabri-classical-homeopathy && find . -type f ! -name MANIFEST.sha256 ! -name SBOM.spdx.json -print | sort)
          python3 scripts/source-tree-hash.py --root . --manifest build-a/SOURCE-MANIFEST.sha256
          sha256sum build-a/05-learn-sabri-classical-homeopathy-4.0.0.zip
