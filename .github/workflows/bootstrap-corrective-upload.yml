name: File 05 Corrective Bootstrap

on:
  push:
    branches: [ audit/file-05-source-review ]
    paths:
      - '.file05-bootstrap/**'
      - '.github/workflows/bootstrap-corrective-upload.yml'
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply-corrective-overlay:
    if: github.event_name == 'push' || github.head_ref == 'audit/file-05-source-review'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: audit/file-05-source-review
      - name: Reassemble and verify corrective overlay
        shell: bash
        run: |
          set -euo pipefail
          cat .file05-bootstrap/overlay.part* > /tmp/file05-overlay.b64
          base64 --decode /tmp/file05-overlay.b64 > /tmp/file05-overlay.tar.gz
          echo 'b773983510aafd4228aee0ed5a6585b186fbbc6a221b8bd405253676992f9544  /tmp/file05-overlay.tar.gz' | sha256sum --check --strict
          if tar -tzf /tmp/file05-overlay.tar.gz | grep -Eq '(^/|(^|/)\.\.(/|$))'; then
            echo 'Unsafe archive path detected.' >&2
            exit 1
          fi
          tar -xzf /tmp/file05-overlay.tar.gz -C .
      - name: Validate corrected source before commit
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do php -l "$file" >/dev/null; done < <(find sabri-learning tests -type f -name '*.php' -print0 | sort -z)
          bash tests/source-invariants.sh
          php tests/security-invariants.php
          python3 scripts/build-release.py --source sabri-learning --output /tmp/file05-a.zip
          python3 scripts/build-release.py --source sabri-learning --output /tmp/file05-b.zip
          cmp -s /tmp/file05-a.zip /tmp/file05-b.zip
          echo '4a12cb82ec475f4e1a0e3c2561bc60ba27b0e35bb0117b11bab1c6e3e66400cf  /tmp/file05-a.zip' | sha256sum --check --strict
          test "$(stat -c '%s' /tmp/file05-a.zip)" -eq 42297
      - name: Commit complete corrective source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .file05-bootstrap .github/workflows/bootstrap-corrective-upload.yml
          rm -f .github/workflows/corrective-integrity.yml
          rm -f CORRECTIVE-PR-STARTED.md CORRECTIVE-TRANSFER-NOTICE.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Remediate File 05 audit blockers and add corrective QA'
          git push origin HEAD:audit/file-05-source-review
