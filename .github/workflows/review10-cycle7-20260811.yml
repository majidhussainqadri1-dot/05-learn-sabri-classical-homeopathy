name: File 05 Seventh Independent Ten-Round Corrective Review

on:
  push:
    branches: [ codex/file-05-complete-v3.0.0 ]

permissions:
  contents: write

concurrency:
  group: file05-review10-cycle7
  cancel-in-progress: false

jobs:
  review10-cycle7:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact candidate branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: codex/file-05-complete-v3.0.0
          fetch-depth: 0

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc # 2.37.1
        with:
          php-version: '8.3'
          coverage: none

      - name: Execute ten sequential review-fix rounds
        run: python3 scripts/review10-cycle7-20260811.py

      - name: Remove temporary review transport
        run: |
          rm -f scripts/review10-cycle7-20260811.py
          rm -f .github/workflows/review10-cycle7-20260811.yml

      - name: Full current-plan regression gate
        run: bash tests/source-invariants.sh

      - name: PHP 8.3 full syntax gate
        run: |
          find 05-learn-sabri-classical-homeopathy tests -type f -name '*.php' -print0 | sort -z | xargs -0 -n1 php -l

      - name: Set up PHP 7.4
        uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc # 2.37.1
        with:
          php-version: '7.4'
          coverage: none

      - name: PHP 7.4 full syntax gate
        run: |
          find 05-learn-sabri-classical-homeopathy tests -type f -name '*.php' -print0 | sort -z | xargs -0 -n1 php -l

      - name: Deterministic package A B verification
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/file05-a /tmp/file05-b /tmp/file05-extract
          python3 scripts/build-release.py --root . --output /tmp/file05-a/05-learn-sabri-classical-homeopathy-4.0.0.zip
          python3 scripts/build-release.py --root . --output /tmp/file05-b/05-learn-sabri-classical-homeopathy-4.0.0.zip
          cmp /tmp/file05-a/05-learn-sabri-classical-homeopathy-4.0.0.zip /tmp/file05-b/05-learn-sabri-classical-homeopathy-4.0.0.zip
          unzip -t /tmp/file05-a/05-learn-sabri-classical-homeopathy-4.0.0.zip
          unzip -q /tmp/file05-a/05-learn-sabri-classical-homeopathy-4.0.0.zip -d /tmp/file05-extract
          (cd /tmp/file05-extract/05-learn-sabri-classical-homeopathy && sha256sum -c MANIFEST.sha256)

      - name: Commit cumulatively corrected source and review ledger
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'majidhussainqadri1-dot'
          git config user.email 'majidhussainqadri1@gmail.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No product corrections produced.'
            exit 0
          fi
          git commit -m 'Complete seventh File 05 ten-round corrective closure'
          git push origin HEAD:codex/file-05-complete-v3.0.0
