name: File 05 Review Round 1 Fix

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: file05-review1-fix-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: false

jobs:
  fix:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.head.ref == 'codex/file-05-complete-v3.0.0' && github.actor != 'github-actions[bot]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: codex/file-05-complete-v3.0.0
          fetch-depth: 0
      - uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc # 2.37.1
        with:
          php-version: '8.3'
          coverage: none
      - name: Apply review-round-1 corrections
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          def read(path):
              return Path(path).read_text(encoding='utf-8')
          def write(path, text):
              Path(path).write_text(text, encoding='utf-8')
          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, found {count}')
              return text.replace(old, new, 1)

          db_path = '05-learn-sabri-classical-homeopathy/includes/class-lsch-database.php'
          db = read(db_path)
          db = replace_once(
              db,
              "\t\t\t'audit'       => $prefix . 'audit_log',\n",
              "\t\t\t'audit'        => $prefix . 'audit_log',\n\t\t\t'request_keys' => $prefix . 'request_keys',\n",
              'request_keys table registry'
          )
          request_table = r'''

		dbDelta( "CREATE TABLE {$t['request_keys']} (
			key_hash char(64) NOT NULL,
			user_id bigint(20) unsigned NOT NULL,
			route varchar(190) NOT NULL,
			method varchar(10) NOT NULL,
			request_hash char(64) NOT NULL,
			status varchar(20) NOT NULL DEFAULT 'processing',
			response_status smallint(5) unsigned NOT NULL DEFAULT 0,
			response_ref_json text NOT NULL,
			created_at datetime NOT NULL,
			updated_at datetime NOT NULL,
			expires_at datetime NOT NULL,
			PRIMARY KEY (key_hash), KEY user_created (user_id,created_at), KEY expiry (expires_at), KEY state_updated (status,updated_at)
		) {$c};" );
'''
          db = replace_once(db, "\n\t\tself::assert_tables();", request_table + "\n\t\tself::assert_tables();", 'request_keys schema')
          write(db_path, db)

          state_path = '05-learn-sabri-classical-homeopathy/includes/class-lsch-state.php'
          state = read(state_path)
          replacement = r'''
	private static function correction_object_lock( $object_id ) {
		global $wpdb;
		$name = 'lsch:corr:' . substr( hash( 'sha256', (string) absint( $object_id ) ), 0, 48 );
		$locked = (int) $wpdb->get_var( $wpdb->prepare( 'SELECT GET_LOCK(%s,3)', $name ) );
		return 1 === $locked ? $name : new WP_Error( 'lsch_correction_object_busy', __( 'Another correction for this learning object is being applied. Reload and try again.', 'learn-sabri-classical-homeopathy' ), array( 'status' => 409 ) );
	}

	private static function correction_object_unlock( $name ) {
		if ( ! $name ) {
			return;
		}
		global $wpdb;
		$wpdb->get_var( $wpdb->prepare( 'SELECT RELEASE_LOCK(%s)', $name ) );
	}

	private static function apply_correction( $object_id, $reason, $expected_version ) {
		global $wpdb;
		$object_id = absint( $object_id );
		$lock = self::correction_object_lock( $object_id );
		if ( is_wp_error( $lock ) ) {
			return $lock;
		}
		try {
			/* Force a database-backed version read after object-level serialization. */
			clean_post_cache( $object_id );
			$type = LSCH_Content::object_type( $object_id );
			if ( ! $type ) {
				return new WP_Error( 'lsch_correction_object_gone', __( 'The learning object is no longer available.', 'learn-sabri-classical-homeopathy' ), array( 'status' => 410 ) );
			}
			$current_version = LSCH_Content::version( $object_id );
			if ( $current_version !== absint( $expected_version ) ) {
				return new WP_Error( 'lsch_correction_stale', __( 'The learning object changed before the correction could be applied.', 'learn-sabri-classical-homeopathy' ), array( 'status' => 409 ) );
			}
			$new_version = $current_version + 1;
			$wpdb->query( 'START TRANSACTION' );
			try {
				update_post_meta( $object_id, '_lsch_correction_note', sanitize_textarea_field( $reason ) );
				if ( false === update_post_meta( $object_id, '_lsch_version', $new_version ) ) {
					throw new RuntimeException( 'content_version_write_failed' );
				}
				if ( LSCH_Content::LESSON === $type ) {
					$t = LSCH_Database::tables();
					$updated = $wpdb->query(
						$wpdb->prepare(
							"UPDATE {$t['progress']} SET needs_review=1,version=version+1,updated_at=%s WHERE lesson_id=%d AND lesson_version<%d",
							LSCH_Database::now(),
							$object_id,
							$new_version
						)
					);
					if ( false === $updated ) {
						throw new RuntimeException( 'learner_review_mark_failed' );
					}
				}
				if ( false === $wpdb->query( 'COMMIT' ) ) {
					throw new RuntimeException( 'correction_commit_failed' );
				}
			} catch ( Throwable $error ) {
				$wpdb->query( 'ROLLBACK' );
				clean_post_cache( $object_id );
				return new WP_Error( 'lsch_correction_apply_failed', __( 'The correction could not be applied atomically. No partial correction was accepted.', 'learn-sabri-classical-homeopathy' ), array( 'status' => 500, 'reason_code' => sanitize_key( $error->getMessage() ) ) );
			}
			clean_post_cache( $object_id );
			LSCH_Events::publish( 'LearningContentCorrected.v1', $type, $object_id, array( 'previous_version' => $current_version, 'new_version' => $new_version ) );
			LSCH_Events::audit( 'learning_content_corrected', $type, $object_id, array( 'new_version' => $new_version ), 'editorial_governance' );
			return $new_version;
		} finally {
			self::correction_object_unlock( $lock );
		}
	}
'''
          pattern = re.compile(r"\n\tprivate static function apply_correction\(.*?\n\t}\n\n\t/\*\*\n\t \* Store only bounded", re.S)
          match = pattern.search(state)
          if not match:
              raise SystemExit('apply_correction block not found')
          state = state[:match.start()] + '\n' + replacement + "\n\t/**\n\t * Store only bounded" + state[match.end():]
          write(state_path, state)

          rest_path = '05-learn-sabri-classical-homeopathy/includes/class-lsch-rest.php'
          rest = read(rest_path)
          legacy_route = "\t\tregister_rest_route( self::NS, '/lesson/(?P<id>\\d+)/correct', array( 'methods' => WP_REST_Server::EDITABLE, 'callback' => array( $this, 'correct' ), 'permission_callback' => array( $this, 'reviewer' ) ) );\n"
          rest = replace_once(rest, legacy_route, '', 'legacy correction bypass route')
          legacy_method = "\tpublic function correct( WP_REST_Request $r ) { return LSCH_Services::mark_content_corrected( absint( $r['id'] ), $r->get_param( 'reason' ) ); }\n"
          rest = replace_once(rest, legacy_method, '', 'legacy correction bypass method')
          write(rest_path, rest)

          static_path = 'tests/static-invariants.py'
          static = read(static_path)
          static = replace_once(static, "    '05-learn-sabri-classical-homeopathy/includes/class-lsch-value.php',\n", "    '05-learn-sabri-classical-homeopathy/includes/class-lsch-value.php',\n    '05-learn-sabri-classical-homeopathy/includes/class-lsch-idempotency.php',\n", 'idempotency required file')
          static = replace_once(static, "    'LSCH_SCHEMA_VERSION\\', 17',\n", "    'LSCH_SCHEMA_VERSION\\', 18',\n", 'schema invariant')
          static = replace_once(static, "    'value_events',\n", "    'value_events',\n    'request_keys',\n    'rest_pre_dispatch',\n    'rest_post_dispatch',\n    'GET_LOCK',\n    'RELEASE_LOCK',\n    'lsch_idempotency_payload_conflict',\n    'lsch_correction_object_busy',\n", 'new reliability invariants')
          static = replace_once(static, "    'reminders', 'outbox', 'inbox', 'jobs', 'audit_log',\n", "    'reminders', 'outbox', 'inbox', 'jobs', 'audit_log', 'request_keys',\n", 'request keys core table invariant')
          if "'/lesson/(?P<id>\\d+)/correct'" in static:
              raise SystemExit('Static tests unexpectedly require legacy correction bypass')
          static += "\n# Review-round-1 bypass and transport assertions.\nrest_source = files.get('05-learn-sabri-classical-homeopathy/includes/class-lsch-rest.php', '')\nif \"/lesson/(?P<id>\\\\d+)/correct\" in rest_source or 'mark_content_corrected' in rest_source:\n    errors.append('Legacy direct correction bypass remains REST-accessible.')\n"
          write(static_path, static)

          trace_path = 'REQUIREMENTS-TRACEABILITY.md'
          trace = read(trace_path)
          trace = trace.replace('idempotency, outbox/inbox, bounded retries, dead-letter, reconcile, safe mode', 'durable privacy-minimized REST idempotency, outbox/inbox, bounded retries, dead-letter, reconcile, safe mode')
          trace = trace.replace('schema 17 idempotency', 'schema 18 idempotency')
          write(trace_path, trace)

          status_path = 'STATUS.md'
          status = read(status_path)
          status = status.replace('Core database/schema marker: `17`', 'Core database/schema marker: `18`')
          status = status.replace('Source review/fix pass 1: version/materialization/File00/private-storage/crypto/search ownership defects corrected; pass 2 required on final exact HEAD', 'Source review/fix pass 1: additionally closed mutating-REST replay/idempotency, legacy correction-bypass and same-object correction-race defects; fresh pass 2 required on the corrected exact HEAD')
          status += "\n## Review Round 1 closure\n\nThe first fresh review after direct-source materialization found three release-significant defects: all mutating File 05 REST calls lacked one durable universal replay guard; the old direct lesson-correction route bypassed the new independent correction-governance state machine; and separately accepted corrections for the same object could race on one object version. Schema 18 adds a 24-hour privacy-minimized request-key ledger, the REST gate holds a per-key advisory lock and stores only non-sensitive response references, the legacy correction route is removed, and correction application now serializes per learning object before a cache-cleared version check.\n"
          write(status_path, status)

          review = """# Review Round 1 — Fresh Adversarial Source Review\n\nReviewed baseline: `0979b41c23e81284baf77386d1def079588d972c`.\n\n## Findings\n\n1. **High — mutating REST replay gap.** Several mutating endpoints were safe only by optimistic state or unique constraints; there was no universal durable Idempotency-Key gate as required by the central API constitution.\n2. **High — correction governance bypass.** `/lesson/{id}/correct` could directly change lesson version outside the proposal → independent review → apply workflow.\n3. **High — same-object correction race.** Two different accepted correction rows could both validate the same cached object version before either serialized the object mutation.\n\n## Corrections\n\n- Core schema 18 adds `lsch_request_keys`: key hash, user, route/method, request hash, processing/completed status, minimal replay reference and 24-hour expiry. No request body, assignment text, private note, assessment answers or patient data are copied into the ledger.\n- `LSCH_Idempotency` requires a valid Idempotency-Key for every File 05 mutating REST request, serializes concurrent identical keys with a database advisory lock, rejects key/payload reuse, blocks incomplete-crash replays, and replays only safe scalar references.\n- The legacy direct correction route/method is removed.\n- Correction application now acquires a per-object advisory lock and clears post cache before re-reading the expected version; one competing accepted correction must become stale.\n\n## Retest gate\n\nPHP 7.4/8.3 lint, current-plan static/security invariants, deterministic package/SBOM/manifest and a new exact-head CI run are required after this correction commit.\n"""
          write('REVIEW-ROUND-1.md', review)

          decision_path = 'DECISION-LOG.md'
          decision = read(decision_path)
          decision += """\n## F05-D-2026-08-10-06 — Universal mutating REST idempotency\n\n**Decision:** Every File 05 mutating REST call is guarded by a durable per-user/per-route Idempotency-Key ledger. The ledger stores request hashes and minimal response references only; canonical/sensitive payloads remain with their owners.\n\n## F05-D-2026-08-10-07 — Correction serialization\n\n**Decision:** The proposal/review correction workflow is the only REST correction path. Applying a correction requires an object-scoped database advisory lock followed by a cache-cleared version check.\n"""
          write(decision_path, decision)

          data_path = 'DATA-DICTIONARY.md'
          data = read(data_path)
          data += """\n## `wp_lsch_request_keys` — schema 18\n\nPrivacy-minimized replay ledger for mutating File 05 REST requests. Stores a SHA-256 idempotency key hash, user ID, route/method, canonical request hash, processing/completed state, HTTP status and a whitelisted scalar response reference only. It MUST NOT store assignment bodies, notes, assessment answers, patient data, identity evidence or other canonical payloads. Default expiry is 24 hours.\n"""
          write(data_path, data)

          migration_path = 'MIGRATION.md'
          migration = read(migration_path)
          migration += """\n## Schema 18\n\nAdditive `wp_lsch_request_keys` creation only. Existing learning rows are not rewritten. The table is private operational state and may be purged after expiry. A failed schema-18 creation leaves File 05 paused by the existing upgrade-failure gate.\n"""
          write(migration_path, migration)
          PY

          git diff --check
          php -l 05-learn-sabri-classical-homeopathy/includes/class-lsch-database.php
          php -l 05-learn-sabri-classical-homeopathy/includes/class-lsch-state.php
          php -l 05-learn-sabri-classical-homeopathy/includes/class-lsch-rest.php
          php -l 05-learn-sabri-classical-homeopathy/includes/class-lsch-idempotency.php
          python3 -m py_compile tests/static-invariants.py
      - name: Review-round-1 retest
        shell: bash
        run: |
          set -euo pipefail
          bash tests/source-invariants.sh
          rm -rf /tmp/file05-r1
          mkdir -p /tmp/file05-r1
          python3 scripts/build-release.py --output /tmp/file05-r1/05-learn-sabri-classical-homeopathy-3.3.0.zip
          unzip -t /tmp/file05-r1/05-learn-sabri-classical-homeopathy-3.3.0.zip >/dev/null
          test -s /tmp/file05-r1/05-learn-sabri-classical-homeopathy-3.3.0.zip.sha256
      - name: Commit review-round-1 corrections
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 05-learn-sabri-classical-homeopathy tests REQUIREMENTS-TRACEABILITY.md STATUS.md REVIEW-ROUND-1.md DECISION-LOG.md DATA-DICTIONARY.md MIGRATION.md
          git diff --cached --check
          git commit -m "Fix File 05 review round 1 reliability and correction governance"
          git push origin HEAD:codex/file-05-complete-v3.0.0
