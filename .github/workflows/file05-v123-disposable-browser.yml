name: File05 V12.3 Disposable Chromium Public UI (NOT Staging)
on:
  push:
    branches:
      - audit/file05-v123-integrated-owner-gates-20261114
      - audit/file05-v123-accessible-ui-20261115
    paths:
      - '05-learn-sabri-classical-homeopathy/**'
      - 'tests/v123-disposable-chromium-landing.test.js'
      - '.github/workflows/file05-v123-disposable-browser.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  disposable-wp:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    services:
      database:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: ci_root_only
          MARIADB_DATABASE: wordpress
          MARIADB_USER: ci_user
          MARIADB_PASSWORD: ci_only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc
        with:
          php-version: '8.3'
          extensions: mysqli, curl, mbstring, xml, zip
          coverage: none
      - name: Exact source and environment
        run: |
          git rev-parse HEAD
          php --version
          php -m | grep -i mysqli
      - name: Install disposable WP-CLI and exact plan WP baseline
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --silent --show-error \
            https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar \
            -o /tmp/wp-cli.phar
          php /tmp/wp-cli.phar --info
          mkdir -p /tmp/file05-wp
          php /tmp/wp-cli.phar core download --version=7.0.1 --path=/tmp/file05-wp
      - name: Install disposable WordPress and File05 with CI-only owners
        run: |
          set -euo pipefail
          WP='php /tmp/wp-cli.phar --path=/tmp/file05-wp'
          $WP config create --dbname=wordpress --dbuser=ci_user --dbpass=ci_only --dbhost=127.0.0.1 --skip-check
          $WP core install --url=http://localhost:8080 --title=File05-CI-Disposable \
            --admin_user=ciadmin --admin_password=ci-only-password --admin_email=ci@example.invalid --skip-email
          mkdir -p /tmp/file05-wp/wp-content/mu-plugins
          cp tests/fixtures/v123-ci-only-owner-contract-stub.php /tmp/file05-wp/wp-content/mu-plugins/f05-ci-only.php
          cp -R 05-learn-sabri-classical-homeopathy /tmp/file05-wp/wp-content/plugins/
          $WP plugin activate 05-learn-sabri-classical-homeopathy
          $WP plugin status 05-learn-sabri-classical-homeopathy
      - name: Real WP REST, schema, private-draft and proposed-connector smoke
        run: |
          set -euo pipefail
          php /tmp/wp-cli.phar --path=/tmp/file05-wp eval-file \
            "$GITHUB_WORKSPACE/tests/v123-wordpress-disposable-smoke.php"
      - name: Install browser automation dependencies
        run: |
          set -euo pipefail
          npm install --no-save playwright@1.58.2 axe-core@4.10.3
          npx playwright install chromium --with-deps
      - name: Open disposable public learning page in local WordPress server
        run: |
          set -euo pipefail
          HOME_ID=$(php /tmp/wp-cli.phar --path=/tmp/file05-wp eval 'echo (int) (((array) get_option("lsch_page_map",array()))["home"] ?? 0);')
          test "$HOME_ID" -gt 0
          # PHP built-in static server must serve CSS/JS directly; index.php as router rewrites assets to HTML.
          php -S 127.0.0.1:8080 -t /tmp/file05-wp >/tmp/file05-browser-server.log 2>&1 &
          for attempt in $(seq 1 35); do
            if curl --fail --silent "http://127.0.0.1:8080/?page_id=$HOME_ID" >/tmp/file05-landing.html; then break; fi
            sleep 1
          done
          grep -q 'lsch-shell' /tmp/file05-landing.html
          echo "F05_TEST_URL=http://127.0.0.1:8080/?page_id=$HOME_ID" >> "$GITHUB_ENV"
      - name: Chromium desktop, mobile and RTL/LTR no-overflow tests
        run: node tests/v123-disposable-chromium-landing.test.js
      - name: Preserve nonprivate diagnostic on failure only
        if: failure()
        run: |
          tail -n 100 /tmp/file05-browser-server.log || true
