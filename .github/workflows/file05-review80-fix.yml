name: File 05 Review-80 Corrective Runner

on:
  push:
    branches: [ codex/file-05-complete-v3.0.0 ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: file05-review80-fix
  cancel-in-progress: false

jobs:
  correct:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: codex/file-05-complete-v3.0.0
          fetch-depth: 0
      - uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc
        with:
          php-version: '8.3'
          coverage: none
      - name: Apply Reviews 21-80 sequentially
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/review80-fix.py')
          s=p.read_text(encoding='utf-8')
          s=s.replace("'items_retained'=>false","'items_retained' => false").replace("'items_retained'=>true","'items_retained' => true")
          for n in ['06','12','15','16','17','19','26']:
              s=s.replace(f'\"file{n}\" in doc.lower()', f'(\"file{n}\" in doc.lower() or \"file {n}\" in doc.lower())')
          p.write_text(s,encoding='utf-8')
          PY
          python3 scripts/review80-fix.py
      - name: Verify final corrected source
        shell: bash
        run: |
          set -euo pipefail
          bash tests/source-invariants.sh
      - name: Commit corrected source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 05-learn-sabri-classical-homeopathy tests
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "Complete File 05 sequential Reviews 21-80"
          git push origin HEAD:codex/file-05-complete-v3.0.0
