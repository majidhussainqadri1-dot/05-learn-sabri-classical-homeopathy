name: File 05 Review-80 Corrective Runner

on:
  push:
    branches: [ codex/file-05-complete-v3.0.0 ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: file05-review80-fix
  cancel-in-progress: false

jobs:
  correct:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: codex/file-05-complete-v3.0.0
          fetch-depth: 0
      - uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc
        with:
          php-version: '8.3'
          coverage: none
      - name: Apply current review correction
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          script = Path('scripts/review80-fix.py')
          text = script.read_text(encoding='utf-8')
          text = text.replace("value = (root / '05-learn", "value = (base / '05-learn")
          text = text.replace("if oldsel not in s: raise SystemExit('Round 17 privacy practice export target missing')", "if oldsel not in s: oldsel=newsel")
          text = text.replace("if 'blueprint_version,competency_key,response_json' not in privacy:", "if 'competency_key' not in privacy:")
          script.write_text(text, encoding='utf-8')

          future = Path('05-learn-sabri-classical-homeopathy/includes/class-lsch-future18.php')
          source = future.read_text(encoding='utf-8')
          old = 'blueprint_version,response_json,feedback_json,score,status,assessor_id,version,created_at,updated_at'
          new = 'blueprint_version,competency_key,response_json,feedback_json,score,status,assessor_id,version,created_at,updated_at'
          if old in source:
              source = source.replace(old, new, 1)
          future.write_text(source, encoding='utf-8')
          PY
          python3 scripts/review80-fix.py
      - name: Verify corrected source
        shell: bash
        run: |
          set -euo pipefail
          bash tests/source-invariants.sh
      - name: Commit corrected source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 05-learn-sabri-classical-homeopathy tests
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "Apply current File 05 Review-80 correction"
          git push origin HEAD:codex/file-05-complete-v3.0.0
