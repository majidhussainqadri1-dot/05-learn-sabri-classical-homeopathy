name: File 05 Review-80 Corrective Runner

on:
  push:
    branches: [ codex/file-05-complete-v3.0.0 ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: file05-review80-fix
  cancel-in-progress: false

jobs:
  correct:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: codex/file-05-complete-v3.0.0
          fetch-depth: 0
      - uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc
        with:
          php-version: '8.3'
          coverage: none
      - name: Round 02 — require current policy eligibility for manager REST actions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('05-learn-sabri-classical-homeopathy/includes/class-lsch-future18-rest.php')
          s = p.read_text(encoding='utf-8')
          old = "\tpublic function manager() { return is_user_logged_in() && current_user_can( LSCH_Capabilities::MANAGE_CURRICULUM ); }"
          new = "\tpublic function manager() { return is_user_logged_in() && LSCH_Policy::can_use_learning_actions() && current_user_can( LSCH_Capabilities::MANAGE_CURRICULUM ); }"
          if old not in s:
              raise SystemExit('Round 02 target not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')

          t = Path('tests/future18-invariants.py')
          x = t.read_text(encoding='utf-8')
          marker = "# Read paths must not mutate personalized pathway state.\n"
          check = "# Privileged Future-18 REST manager actions must recheck current account policy state.\nif \"public function manager() { return is_user_logged_in() && LSCH_Policy::can_use_learning_actions() && current_user_can( LSCH_Capabilities::MANAGE_CURRICULUM ); }\" not in r:\n    errors.append('Future-18 manager REST actions do not recheck current account eligibility/suspension/guardian policy.')\n\n"
          if marker not in x:
              raise SystemExit('Round 02 invariant insertion marker missing')
          if check.strip() not in x:
              x = x.replace(marker, check + marker, 1)
          t.write_text(x, encoding='utf-8')
          PY
          bash tests/source-invariants.sh
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 05-learn-sabri-classical-homeopathy/includes/class-lsch-future18-rest.php tests/future18-invariants.py
          git commit -m "Review 02: enforce current policy on Future-18 manager actions"
          git push origin HEAD:codex/file-05-complete-v3.0.0
