name: File 05 Review Round 2 Fix

on: [push, workflow_dispatch]

permissions:
  contents: write

jobs:
  fix:
    if: github.ref == 'refs/heads/codex/file-05-complete-v3.0.0' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: codex/file-05-complete-v3.0.0
          fetch-depth: 0
      - uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc
        with:
          php-version: '8.3'
          coverage: none
      - name: Apply adversarial source corrections
        run: python3 .github/file05-review2-fix.py
      - name: Verify corrected source
        run: |
          set -euo pipefail
          git diff --check
          php -l 05-learn-sabri-classical-homeopathy/includes/class-lsch-idempotency.php
          php -l 05-learn-sabri-classical-homeopathy/includes/class-lsch-services.php
          python3 -m py_compile tests/static-invariants.py
          bash tests/source-invariants.sh
          rm -rf /tmp/file05-r2
          mkdir -p /tmp/file05-r2
          python3 scripts/build-release.py --output /tmp/file05-r2/05-learn-sabri-classical-homeopathy-3.3.0.zip
          unzip -t /tmp/file05-r2/05-learn-sabri-classical-homeopathy-3.3.0.zip >/dev/null
      - name: Commit corrected source
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 05-learn-sabri-classical-homeopathy tests .github/file05-review2-fix.py
          git diff --cached --check
          git commit -m 'Fix File 05 review round 2 permission and error paths'
          git push origin HEAD:codex/file-05-complete-v3.0.0
