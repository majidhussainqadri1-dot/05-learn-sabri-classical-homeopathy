name: File 05 Baseline Integrity

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ baseline/file-05-original-import ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integrity:
    if: github.head_ref == 'baseline/file-05-original-import' || github.ref == 'refs/heads/baseline/file-05-original-import'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact extracted-source checksums
        run: sha256sum --check CHECKSUMS.sha256
      - name: Verify original source inventory
        shell: bash
        run: |
          set -euo pipefail
          test "$(find sabri-learning -type f | wc -l)" -eq 19
          test "$(find sabri-learning -type f -name '*.php' | wc -l)" -eq 13
          test -f sabri-learning/sabri-learning.php

  php-syntax:
    if: github.head_ref == 'baseline/file-05-original-import' || github.ref == 'refs/heads/baseline/file-05-original-import'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Lint all original PHP files
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do php -l "$file"; done < <(find sabri-learning -type f -name '*.php' -print0 | sort -z)
