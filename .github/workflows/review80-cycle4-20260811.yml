name: File 05 Fourth Independent Review-80 Corrective Runner

on:
  push:
    branches: [ codex/file-05-complete-v3.0.0 ]

permissions:
  contents: write

concurrency:
  group: file05-review80-cycle4
  cancel-in-progress: false

jobs:
  review80-cycle4:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact candidate branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: codex/file-05-complete-v3.0.0
          fetch-depth: 0

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc # 2.37.1
        with:
          php-version: '8.3'
          coverage: none

      - name: Repair cycle4 review transport
        run: python3 scripts/review80-cycle4-hotfix.py

      - name: Execute 80 sequential review/fix rounds
        shell: bash
        run: |
          set -o pipefail
          python3 scripts/review80-cycle4-20260811.py 2>&1 | tee /tmp/review80-cycle4-diagnostic.txt

      - name: Persist review-runner diagnostic if correction transport fails
        if: failure()
        shell: bash
        run: |
          cp /tmp/review80-cycle4-diagnostic.txt /tmp/review80-cycle4-preserved.txt 2>/dev/null || true
          git config user.name 'majidhussainqadri1-dot'
          git config user.email 'majidhussainqadri1@gmail.com'
          git reset --hard HEAD
          git clean -fd
          printf '%s\n' 'Fourth Review-80 runner failed before corrected-source commit. This diagnostic is transport evidence, not a product completion claim.' > REVIEW80-CYCLE4-FAILURE-DIAGNOSTIC.txt
          cat /tmp/review80-cycle4-preserved.txt >> REVIEW80-CYCLE4-FAILURE-DIAGNOSTIC.txt 2>/dev/null || true
          git add REVIEW80-CYCLE4-FAILURE-DIAGNOSTIC.txt
          git commit -m 'Record fourth Review-80 runner diagnostic' || true
          git push origin HEAD:codex/file-05-complete-v3.0.0 || true

      - name: Remove temporary review transport before final-tree QA
        run: |
          rm -f scripts/review80-cycle4-hotfix.py
          rm -f scripts/review80-cycle4-20260811.py
          rm -f .github/workflows/review80-cycle4-20260811.yml
          rm -f REVIEW80-CYCLE4-FAILURE-DIAGNOSTIC.txt

      - name: Full source/security/policy/Future18 regression gate
        run: bash tests/source-invariants.sh

      - name: PHP 8.3 full syntax gate
        run: |
          find 05-learn-sabri-classical-homeopathy tests -type f -name '*.php' -print0 | sort -z | xargs -0 -n1 php -l

      - name: Set up PHP 7.4
        uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc # 2.37.1
        with:
          php-version: '7.4'
          coverage: none

      - name: PHP 7.4 full syntax gate
        run: |
          find 05-learn-sabri-classical-homeopathy tests -type f -name '*.php' -print0 | sort -z | xargs -0 -n1 php -l

      - name: Deterministic package A/B closure
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/file05-c4-a /tmp/file05-c4-b
          python3 scripts/build-release.py --root . --output /tmp/file05-c4-a/05-learn-sabri-classical-homeopathy-4.0.0.zip
          python3 scripts/build-release.py --root . --output /tmp/file05-c4-b/05-learn-sabri-classical-homeopathy-4.0.0.zip
          cmp /tmp/file05-c4-a/05-learn-sabri-classical-homeopathy-4.0.0.zip /tmp/file05-c4-b/05-learn-sabri-classical-homeopathy-4.0.0.zip
          unzip -t /tmp/file05-c4-a/05-learn-sabri-classical-homeopathy-4.0.0.zip
          mkdir -p /tmp/file05-c4-extract
          unzip -q /tmp/file05-c4-a/05-learn-sabri-classical-homeopathy-4.0.0.zip -d /tmp/file05-c4-extract
          (cd /tmp/file05-c4-extract/05-learn-sabri-classical-homeopathy && sha256sum -c MANIFEST.sha256)

      - name: Commit corrected exact working tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'majidhussainqadri1-dot'
          git config user.email 'majidhussainqadri1@gmail.com'
          git status --short
          git add -A
          if git diff --cached --quiet; then
            echo 'No corrective changes to commit.'
            exit 0
          fi
          git commit -m 'Complete fourth independent File 05 Review-80 corrective closure'
          git push origin HEAD:codex/file-05-complete-v3.0.0
