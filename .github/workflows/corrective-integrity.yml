name: File 05 Corrective Integrity

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ audit/file-05-source-review ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: file-05-corrective-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-invariants:
    if: github.head_ref == 'audit/file-05-source-review' || github.ref == 'refs/heads/audit/file-05-source-review'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Verify source and architecture invariants
        run: bash tests/source-invariants.sh
      - name: Run deterministic security invariants
        run: php tests/security-invariants.php

  php-syntax:
    if: github.head_ref == 'audit/file-05-source-review' || github.ref == 'refs/heads/audit/file-05-source-review'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.3']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc # 2.37.1
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Lint all plugin and test PHP files
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do php -l "$file"; done < <(find sabri-learning tests -type f -name '*.php' -print0 | sort -z)

  reproducible-package:
    if: github.head_ref == 'audit/file-05-source-review' || github.ref == 'refs/heads/audit/file-05-source-review'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build twice and compare
        run: |
          set -euo pipefail
          python3 scripts/build-release.py --output build-a.zip
          python3 scripts/build-release.py --output build-b.zip
          cmp build-a.zip build-b.zip
          sha256sum build-a.zip build-b.zip
      - name: Upload RC evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: file-05-1.0.0-rc1
          path: |
            build-a.zip
            build-a.zip.sha256
          if-no-files-found: error
          retention-days: 30
