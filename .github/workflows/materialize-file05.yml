name: Materialize File 05 Complete Candidate

on:
  push:
    branches: [ codex/file-05-complete-v2.0.0 ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: materialize-file05-${{ github.ref }}
  cancel-in-progress: false

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Materialize reviewed source tree
        run: python3 materialize/apply.py
      - name: Commit complete candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Complete File 05 learning platform v2.0.0"
          git push origin HEAD:codex/file-05-complete-v2.0.0
