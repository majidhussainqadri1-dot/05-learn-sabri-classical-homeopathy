name: File 05 Fresh Review-80 Corrective Runner

on:
  push:
    branches:
      - codex/file-05-complete-v3.0.0

permissions:
  contents: write

concurrency:
  group: file05-review80-fresh-20260811
  cancel-in-progress: false

jobs:
  review80-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact candidate branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: codex/file-05-complete-v3.0.0
          fetch-depth: 0

      - name: Apply sequential Review-80 corrections
        run: python3 scripts/review80-fresh-20260811.py

      - name: Remove temporary review transport before final-tree QA
        run: |
          rm -f scripts/review80-fresh-20260811.py
          rm -f .github/workflows/review80-fresh-20260811.yml

      - name: Diff hygiene
        run: git diff --check

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc # 2.37.1
        with:
          php-version: '8.3'
          coverage: none

      - name: Full source/security/policy/Future18 regression gate
        id: regression
        shell: bash
        run: |
          set +e
          bash tests/source-invariants.sh > /tmp/file05-review80-regression.log 2>&1
          status=$?
          cat /tmp/file05-review80-regression.log
          if [ "$status" -ne 0 ]; then
            {
              echo '## Review-80 regression failure diagnostics'
              echo '```text'
              cat /tmp/file05-review80-regression.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit "$status"
          fi

      - name: Persist regression diagnostic without partial source fixes
        if: failure() && steps.regression.conclusion == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          diagnostic="$(cat /tmp/file05-review80-regression.log)"
          git reset --hard HEAD
          printf '%s\n' "$diagnostic" > REVIEW-80-FAILURE-DIAGNOSTIC.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add REVIEW-80-FAILURE-DIAGNOSTIC.txt
          git commit -m 'Record Review-80 regression diagnostic'
          git push origin HEAD:codex/file-05-complete-v3.0.0

      - name: PHP 8.3 full syntax gate
        shell: bash
        run: |
          set -euo pipefail
          find 05-learn-sabri-classical-homeopathy tests -type f -name '*.php' -print0 | sort -z | xargs -0 -n1 php -l

      - name: Set up PHP 7.4
        uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc # 2.37.1
        with:
          php-version: '7.4'
          coverage: none

      - name: PHP 7.4 full syntax gate
        shell: bash
        run: |
          set -euo pipefail
          find 05-learn-sabri-classical-homeopathy tests -type f -name '*.php' -print0 | sort -z | xargs -0 -n1 php -l

      - name: Deterministic package A/B closure
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/file05-review80-a /tmp/file05-review80-b
          mkdir -p /tmp/file05-review80-a /tmp/file05-review80-b
          python3 scripts/build-release.py --root . --output /tmp/file05-review80-a/05-learn-sabri-classical-homeopathy-4.0.0.zip
          python3 scripts/build-release.py --root . --output /tmp/file05-review80-b/05-learn-sabri-classical-homeopathy-4.0.0.zip
          cmp /tmp/file05-review80-a/05-learn-sabri-classical-homeopathy-4.0.0.zip /tmp/file05-review80-b/05-learn-sabri-classical-homeopathy-4.0.0.zip
          unzip -t /tmp/file05-review80-a/05-learn-sabri-classical-homeopathy-4.0.0.zip

      - name: Commit corrected exact working tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          test -n "$(git status --porcelain)"
          git commit -m 'Complete fresh 80-round File 05 corrective closure'
          git push origin HEAD:codex/file-05-complete-v3.0.0
